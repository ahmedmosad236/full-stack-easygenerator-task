name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-test:
    name: Lint, Type-Check, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 4000
      MONGODB_URI: mongodb://127.0.0.1:27017/auth_test_ci
      MONGODB_URI_TEST: mongodb://127.0.0.1:27017/auth_test_ci
      JWT_SECRET: ci_test_only_jwt_secret_key_at_least_32_characters
      JWT_EXPIRES_IN: 15m
      WEB_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:4000/api
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type-check
        run: pnpm run type-check

      - name: Run Backend unit and integration tests
        run: pnpm --filter @repo/api test

      - name: Run Frontend unit and component tests
        run: pnpm --filter @repo/web test

      - name: Build Backend and Frontend
        run: pnpm run build
